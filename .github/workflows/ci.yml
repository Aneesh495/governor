name: Governor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Code Hygiene & Formatting Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Formatting & Character Cleanliness Audit
        run: python3 tools/verify_clean_code.py

  test:
    name: Standard ML Regression & Property Test Suite
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Poly/ML
        run: |
          sudo apt-get update
          sudo apt-get install -y polyml

      - name: Run Master Test Harness
        run: poly --script test/run_tests.sml

  build:
    name: MLton Native Whole-Program Compilation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MLton
        run: |
          sudo apt-get update
          sudo apt-get install -y mlton

      - name: Build Native Binary
        run: |
          mkdir -p bin
          mlton -output bin/governor governor.mlb

      - name: Execute Native Benchmark Sanity Run
        run: ./bin/governor --bench 50000

      - name: Execute Simulation Sanity Run
        run: ./bin/governor --sim 100
